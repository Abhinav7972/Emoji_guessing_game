<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./emoji.css">
    <title>Emoji guessing game</title>
</head>
<body>
     <div class="main">
        <div class="container">
      <div class="heading">
        <h1>Emoji guessing game</h1>
      </div>
      <div class="emoji"><p id="emojis"></p></div>
      <div class="emoji-input">
        <input type="text" id="emoji-value" placeholder="Enter your guess..."/>
      </div>
      <div class="score"><p id="score-value">Score : 0</p></div>
      </div>

      <div class="timer">
        <p id="timer-value">second : 0</p>
      </div>

      <div class="notification">
        <p id="notification-value">Error</p>
      </div>
     </div>
    <script src="./emoji.js"></script>
</body>
</html>
